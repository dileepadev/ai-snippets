name: Checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate snippet files
        run: npm run validate
      - name: Type-check and build
        run: npm run build
      - name: Check library interactions and generated links
        run: npm test
